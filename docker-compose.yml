version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: arena-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: arena_latam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "50m" 
        max-file: "3"

volumes:
  postgres_data:
    driver: local
