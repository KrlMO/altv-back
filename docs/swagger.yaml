info:
  contact: {}
  description: API principal de Arena Latam
  title: Arena API
  version: "1.0"
paths:
  /api/v1/auth/login/local:
    post:
      consumes:
      - application/json
      description: Logs in a user
      parameters:
      - description: User info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_domain_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_domain_auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login a user
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Logs out a user by revoking their refresh token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseOk-any'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout a user
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh tokens
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseOk-internal_domain_auth_LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh user token
      tags:
      - Auth
  /api/v1/auth/register/local:
    post:
      consumes:
      - application/json
      description: Registers a user with local auth and logs them in
      parameters:
      - description: User info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/arena_internal_domain_users.RegisterUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register and login a user
      tags:
      - Auth
  /api/v1/auth/resend-verification:
    post:
      consumes:
      - application/json
      description: Resends the email verification token to the user's email
      parameters:
      - description: Email info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_domain_auth.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseOk-any'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resend email verification
      tags:
      - Auth
  /api/v1/auth/verify-email:
    get:
      consumes:
      - application/json
      description: Verifies the email using the token and marks the user as verified
      parameters:
      - description: Verification token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseOk-any'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify email
      tags:
      - Auth
    post:
      consumes:
      - application/json
      description: Verifies if the email verification token is valid and returns the
        status
      parameters:
      - description: Email info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_domain_auth.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseOk-internal_domain_auth_VerifyEmailVerificationResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify email verification
      tags:
      - Auth
  /api/v1/countries/:
    get:
      consumes:
      - application/json
      description: Retrieves a list of all countries
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_domain_countries.CountryResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all countries
      tags:
      - Countries
  /api/v1/games:
    get:
      consumes:
      - application/json
      description: Get a list of games, optionally filtered by name
      parameters:
      - description: Filter by game name
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseOk-array_internal_domain_games_GameListItemResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
      summary: List Games
      tags:
      - Games
  /api/v1/organizations/my:
    get:
      consumes:
      - application/json
      description: Retrieves every organization the authenticated user belongs to,
        grouped by the organization role the user holds in each one. Each organization
        also reports the permission codes granted by its currently valid plans. BANNED
        users are rejected.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseOk-array_internal_domain_organizations_OrganizationRoleGroupDto'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
      security:
      - BearerAuth: []
      summary: List the organizations of the authenticated user
      tags:
      - Organizations
  /api/v1/regions:
    get:
      consumes:
      - application/json
      description: Retrieves a list of all registered regions
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseOk-array_internal_domain_regions_RegionResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
      summary: Get all regions
      tags:
      - Regions
  /api/v1/team-games:
    get:
      consumes:
      - application/json
      description: Get a paginated list of team games with optional filters
      parameters:
      - description: Filter by team game name
        in: query
        name: name
        type: string
      - description: Filter by region ID
        in: query
        name: region_id
        type: integer
      - description: Filter by country ID
        in: query
        name: country_id
        type: integer
      - description: Filter by game ID
        in: query
        name: game_id
        type: integer
      - description: 'Sort order: name_asc, name_desc, newest, oldest'
        in: query
        name: sort_by
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_domain_team_games.TeamGameListSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
      summary: List Team Games
      tags:
      - Team Games
  /api/v1/team-games/{id}/activate:
    patch:
      consumes:
      - application/json
      description: Sets the active flag of a team game to true
      parameters:
      - description: Team Game ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseOk-map_string_string'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
      security:
      - BearerAuth: []
      summary: Activate Team Game
      tags:
      - Team Games
  /api/v1/team-games/{id}/deactivate:
    patch:
      consumes:
      - application/json
      description: Sets the active flag of a team game to false
      parameters:
      - description: Team Game ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseOk-map_string_string'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
