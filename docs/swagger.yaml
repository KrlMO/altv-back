basePath: /
definitions:
  auth.LoginRequest:
    properties:
      email_or_nickname:
        type: string
      password:
        type: string
    required:
    - email_or_nickname
    - password
    type: object
  auth.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.UserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      nickname:
        type: string
      profile_photo:
        type: string
    type: object
  teams.PatchUpdateTeamRequest:
    properties:
      active:
        type: boolean
      banner_path:
        type: string
      country_id:
        type: integer
      description:
        type: string
      is_virtual:
        type: boolean
      logo_path:
        type: string
      name:
        type: string
      tag:
        type: string
    type: object
  teams.RegisterTeamRequest:
    properties:
      banner_path:
        type: string
      country_id:
        type: integer
      description:
        maxLength: 500
        type: string
      is_virtual:
        type: boolean
      logo_path:
        type: string
      name:
        maxLength: 50
        minLength: 3
        type: string
      tag:
        maxLength: 15
        minLength: 2
        type: string
    required:
    - country_id
    - name
    - tag
    type: object
  users.CountryReponse:
    properties:
      flag_path:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  users.FastRegisterUserRequest:
    properties:
      country_id:
        type: integer
      email:
        type: string
      nickname:
        type: string
      password:
        type: string
    required:
    - country_id
    - email
    - nickname
    - password
    type: object
  users.PatchUserProfileRequest:
    properties:
      banner_photo:
        type: string
      birth_date:
        type: string
      country_id:
        type: integer
      first_name:
        type: string
      last_name:
        type: string
      nickname:
        type: string
      profile_photo:
        type: string
    type: object
  users.RegisterUserRequest:
    properties:
      birth_date:
        type: string
      country_id:
        type: integer
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      nickname:
        type: string
      password:
        type: string
    required:
    - birth_date
    - country_id
    - email
    - first_name
    - last_name
    - nickname
    - password
    type: object
  users.UpdateUserProfileRequest:
    properties:
      banner_photo:
        type: string
      birth_date:
        type: string
      country_id:
        type: integer
      first_name:
        type: string
      last_name:
        type: string
      nickname:
        type: string
      profile_photo:
        type: string
    type: object
  users.UserProfileResponse:
    properties:
      banner_photo:
        type: string
      birth_date:
        type: string
      country:
        $ref: '#/definitions/users.CountryReponse'
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      nickname:
        type: string
      profile_photo:
        type: string
    type: object
info:
  contact: {}
  description: API principal de Arena Latam
  title: Arena API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Logs in a user
      parameters:
      - description: User info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login a user
      tags:
      - Auth
  /teams:
    get:
      consumes:
      - application/json
      description: Retrieves a list of teams with optional filters
      parameters:
      - description: Filter by country ID
        in: query
        name: country_id
        type: integer
      - description: Filter by owner ID
        in: query
        name: owner_id
        type: integer
      - description: Filter by active status
        in: query
        name: active
        type: boolean
      - description: Filter by name substring
        in: query
        name: name_like
        type: string
      - description: Filter by tag substring
        in: query
        name: tag_like
        type: string
      - default: 10
        description: Limit number of results
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset for pagination
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get list of teams
      tags:
      - Teams
    post:
      consumes:
      - application/json
      description: Creates a new team in the system
      parameters:
      - description: Team info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/teams.RegisterTeamRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Register a new team
      tags:
      - Teams
  /teams/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves a team by its ID
      parameters:
      - description: Team ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get team by ID
      tags:
      - Teams
    patch:
      consumes:
      - application/json
      description: Updates the details of an existing team
      parameters:
      - description: Team ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated team info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/teams.PatchUpdateTeamRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update team details
      tags:
      - Teams
  /users/fast-register:
    post:
      consumes:
      - application/json
      description: Quickly creates a new user in the system with minimal info
      parameters:
      - description: User info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.FastRegisterUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Fast register a new user
      tags:
      - Users
  /users/me:
    get:
      description: Retrieves the profile of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/users.UserProfileResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - Users
    patch:
      consumes:
      - application/json
      description: Partially updates the profile of the currently authenticated user
      parameters:
      - description: Partially updated user info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.PatchUserProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Partially update current user profile
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Updates the profile of the currently authenticated user
      parameters:
      - description: Updated user info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.UpdateUserProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - Users
  /users/register:
    post:
      consumes:
      - application/json
      description: Creates a new user in the system
      parameters:
      - description: User info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.RegisterUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - Users
schemes:
- http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
