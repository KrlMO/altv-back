basePath: /
definitions:
  arena_internal_domain_users.ProvidersAuthResponse:
    properties:
      id:
        type: integer
      is_verified:
        type: boolean
      provider:
        type: string
      provider_uid:
        type: string
    type: object
  arena_internal_domain_users.RegisterUserRequest:
    properties:
      birth_date:
        type: string
      country_id:
        type: integer
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      nickname:
        type: string
      password:
        type: string
    required:
    - birth_date
    - country_id
    - email
    - first_name
    - last_name
    - nickname
    - password
    type: object
  arena_pkg_dto.CountryResponse:
    properties:
      flag_path:
        type: string
      id:
        type: integer
      iso_code:
        type: string
      name:
        type: string
    type: object
  arena_pkg_dto.PaginatedResponse-internal_domain_team_games_TeamGameListItemResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_domain_team_games.TeamGameListItemResponse'
        type: array
      meta:
        $ref: '#/definitions/arena_pkg_dto.PaginationMeta'
    type: object
  arena_pkg_dto.PaginationMeta:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  arena_pkg_response.ResponseError:
    properties:
      code:
        type: string
      error:
        type: string
    type: object
  arena_pkg_response.ResponseOk-any:
    properties:
      data: {}
      msg:
        type: string
    type: object
  arena_pkg_response.ResponseOk-array_internal_domain_games_GameListItemResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_domain_games.GameListItemResponse'
        type: array
      msg:
        type: string
    type: object
  arena_pkg_response.ResponseOk-array_internal_domain_regions_RegionResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_domain_regions.RegionResponse'
        type: array
      msg:
        type: string
    type: object
  arena_pkg_response.ResponseOk-internal_domain_auth_LoginResponse:
    properties:
      data:
        $ref: '#/definitions/internal_domain_auth.LoginResponse'
      msg:
        type: string
    type: object
  arena_pkg_response.ResponseOk-internal_domain_auth_VerifyEmailVerificationResponse:
    properties:
      data:
        $ref: '#/definitions/internal_domain_auth.VerifyEmailVerificationResponse'
      msg:
        type: string
    type: object
  internal_domain_auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_domain_auth.LoginResponse:
    properties:
      access_token:
        type: string
      user:
        $ref: '#/definitions/internal_domain_auth.UserResponse'
    type: object
  internal_domain_auth.UserResponse:
    properties:
      auth:
        items:
          $ref: '#/definitions/arena_internal_domain_users.ProvidersAuthResponse'
        type: array
      id:
        type: integer
      nickname:
        type: string
      profile_photo:
        type: string
    type: object
  internal_domain_auth.VerifyEmailRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  internal_domain_auth.VerifyEmailVerificationResponse:
    properties:
      resend_cooldown:
        type: integer
      status:
        type: string
    type: object
  internal_domain_countries.CountryResponse:
    properties:
      flag_path:
        type: string
      id:
        type: integer
      iso_code:
        type: string
      name:
        type: string
    type: object
  internal_domain_games.GameListItemResponse:
    properties:
      color_hex:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  internal_domain_regions.RegionResponse:
    properties:
      flag_path:
        type: string
      id:
        type: integer
      iso_code:
        type: string
      name:
        type: string
    type: object
  internal_domain_team_games.AddTeamGameMembersRequest:
    properties:
      game_id:
        type: integer
      members:
        items:
          $ref: '#/definitions/internal_domain_team_games.ReqTeamGameMember'
        maxItems: 50
        minItems: 1
        type: array
    required:
    - game_id
    - members
    type: object
  internal_domain_team_games.AddTeamGameRoleToMemberRequest:
    properties:
      users:
        items:
          $ref: '#/definitions/internal_domain_team_games.TeamGameMemberDto'
        maxItems: 50
        minItems: 1
        type: array
    required:
    - users
    type: object
  internal_domain_team_games.RemoveTeamGameMembersRequest:
    properties:
      members:
        items:
          type: integer
        maxItems: 50
        minItems: 1
        type: array
    required:
    - members
    type: object
  internal_domain_team_games.RemoveTeamGameRoleFromUserRequest:
    properties:
      users:
        items:
          $ref: '#/definitions/internal_domain_team_games.TeamGameMemberDto'
        maxItems: 50
        minItems: 1
        type: array
    required:
    - users
    type: object
  internal_domain_team_games.ReqTeamGameMember:
    properties:
      teamGameRoleID:
        type: integer
      userID:
        type: integer
    type: object
  internal_domain_team_games.TeamGameListItemResponse:
    properties:
      country_name:
        type: string
      created_at:
        type: string
      game_name:
        type: string
      id:
        type: integer
      logo_path:
        type: string
      region_iso:
        type: string
      region_name:
        type: string
      team_name:
        type: string
    type: object
  internal_domain_team_games.TeamGameListSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/arena_pkg_dto.PaginatedResponse-internal_domain_team_games_TeamGameListItemResponse'
      msg:
        type: string
    type: object
  internal_domain_team_games.TeamGameMemberDto:
    properties:
      roles:
        items:
          $ref: '#/definitions/internal_domain_team_games.TeamGameRoleDto'
        type: array
      userID:
        type: integer
    type: object
  internal_domain_team_games.TeamGameRoleDto:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  internal_domain_teams.AddMemberRequest:
    properties:
      role:
        type: string
      user_id:
        type: integer
    required:
    - role
    - user_id
    type: object
  internal_domain_teams.CreateTeamGameRequest:
    properties:
      active:
        type: boolean
      banner_path:
        type: string
      game_slug:
        type: string
      logo_path:
        type: string
      name:
        maxLength: 150
        minLength: 3
        type: string
    required:
    - game_slug
    - name
    type: object
  internal_domain_teams.PatchUpdateTeamRequest:
    properties:
      banner_path:
        type: string
      country_id:
        type: integer
      description:
        type: string
      is_virtual:
        type: boolean
      logo_path:
        type: string
      name:
        type: string
      tag:
        type: string
    type: object
  internal_domain_teams.RegisterTeamRequest:
    properties:
      banner_path:
        type: string
      country_id:
        type: integer
      description:
        maxLength: 500
        type: string
      is_virtual:
        type: boolean
      logo_path:
        type: string
      name:
        maxLength: 50
        minLength: 3
        type: string
      tag:
        maxLength: 15
        minLength: 2
        type: string
    required:
    - country_id
    - name
    - tag
    type: object
  internal_domain_teams.UpdateTeamMemberRoleRequest:
    properties:
      role:
        type: string
    required:
    - role
    type: object
  internal_domain_users.FastRegisterUserRequest:
    properties:
      country_id:
        type: integer
      email:
        type: string
      nickname:
        type: string
      password:
        type: string
    required:
    - country_id
    - email
    - nickname
    - password
    type: object
  internal_domain_users.PatchUserProfileRequest:
    properties:
      banner_photo:
        type: string
      birth_date:
        type: string
      country_id:
        type: integer
      first_name:
        type: string
      last_name:
        type: string
      nickname:
        type: string
      profile_photo:
        type: string
    type: object
  internal_domain_users.ProvidersAuthResponse:
    properties:
      id:
        type: integer
      is_verified:
        type: boolean
      provider:
        type: string
      provider_uid:
        type: string
    type: object
  internal_domain_users.RegisterUserRequest:
    properties:
      birth_date:
        type: string
      country_id:
        type: integer
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      nickname:
        type: string
      password:
        type: string
    required:
    - birth_date
    - country_id
    - email
    - first_name
    - last_name
    - nickname
    - password
    type: object
  internal_domain_users.UpdateUserProfileRequest:
    properties:
      banner_photo:
        type: string
      birth_date:
        type: string
      country_id:
        type: integer
      first_name:
        type: string
      last_name:
        type: string
      nickname:
        type: string
      profile_photo:
        type: string
    type: object
  internal_domain_users.UserProfileResponse:
    properties:
      auth:
        items:
          $ref: '#/definitions/internal_domain_users.ProvidersAuthResponse'
        type: array
      banner_photo:
        type: string
      birth_date:
        type: string
      country:
        $ref: '#/definitions/arena_pkg_dto.CountryResponse'
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      nickname:
        type: string
      profile_photo:
        type: string
    type: object
info:
  contact: {}
  description: API principal de Arena Latam
  title: Arena API
  version: "1.0"
paths:
  /api/v1/auth/login/local:
    post:
      consumes:
      - application/json
      description: Logs in a user
      parameters:
      - description: User info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_domain_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_domain_auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login a user
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Logs out a user by revoking their refresh token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseOk-any'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout a user
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh tokens
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseOk-internal_domain_auth_LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh user token
      tags:
      - Auth
  /api/v1/auth/register/local:
    post:
      consumes:
      - application/json
      description: Registers a user with local auth and logs them in
      parameters:
      - description: User info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/arena_internal_domain_users.RegisterUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register and login a user
      tags:
      - Auth
  /api/v1/auth/resend-verification:
    post:
      consumes:
      - application/json
      description: Resends the email verification token to the user's email
      parameters:
      - description: Email info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_domain_auth.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseOk-any'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resend email verification
      tags:
      - Auth
  /api/v1/auth/verify-email:
    get:
      consumes:
      - application/json
      description: Verifies the email using the token and marks the user as verified
      parameters:
      - description: Verification token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseOk-any'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify email
      tags:
      - Auth
    post:
      consumes:
      - application/json
      description: Verifies if the email verification token is valid and returns the
        status
      parameters:
      - description: Email info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_domain_auth.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseOk-internal_domain_auth_VerifyEmailVerificationResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify email verification
      tags:
      - Auth
  /api/v1/countries/:
    get:
      consumes:
      - application/json
      description: Retrieves a list of all countries
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_domain_countries.CountryResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all countries
      tags:
      - Countries
  /api/v1/games:
    get:
      consumes:
      - application/json
      description: Get a list of games, optionally filtered by name
      parameters:
      - description: Filter by game name
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseOk-array_internal_domain_games_GameListItemResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
      summary: List Games
      tags:
      - Games
  /api/v1/regions:
    get:
      consumes:
      - application/json
      description: Retrieves a list of all registered regions
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseOk-array_internal_domain_regions_RegionResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
      summary: Get all regions
      tags:
      - Regions
  /api/v1/team-games:
    get:
      consumes:
      - application/json
      description: Get a paginated list of team games with optional filters
      parameters:
      - description: Filter by team game name
        in: query
        name: name
        type: string
      - description: Filter by region ID
        in: query
        name: region_id
        type: integer
      - description: Filter by country ID
        in: query
        name: country_id
        type: integer
      - description: Filter by game ID
        in: query
        name: game_id
        type: integer
      - description: 'Sort order: name_asc, name_desc, newest, oldest'
        in: query
        name: sort_by
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_domain_team_games.TeamGameListSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
      summary: List Team Games
      tags:
      - Team Games
  /api/v1/team-games/{id}/leave:
    post:
      consumes:
      - application/json
      description: Allows the current user to leave a team game
      parameters:
      - description: Team Game ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
      security:
      - BearerAuth: []
      summary: Leave Team Game
      tags:
      - Team Games
  /api/v1/team-games/{id}/members:
    delete:
      consumes:
      - application/json
      description: Remove members from a team game
      parameters:
      - description: Team Game ID
        in: path
        name: id
        required: true
        type: string
      - description: Remove Team Game Members Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_domain_team_games.RemoveTeamGameMembersRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
      security:
      - BearerAuth: []
      summary: Remove Members from Team Game
      tags:
      - Team Games
    get:
      consumes:
      - application/json
      description: Get public members of a team game by team game ID
      parameters:
      - description: Team Game ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
      summary: List Team Game Members
      tags:
      - Team Games
    post:
      consumes:
      - application/json
      description: Add members to a team game
      parameters:
      - description: Team Game ID
        in: path
        name: id
        required: true
        type: string
      - description: Add Team Game Members Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_domain_team_games.AddTeamGameMembersRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
      security:
      - BearerAuth: []
      summary: Add Members to Team Game
      tags:
      - Team Games
  /api/v1/team-games/{id}/members/roles:
    delete:
      consumes:
      - application/json
      description: Remove a specific role from members in a team game
      parameters:
      - description: Team Game ID
        in: path
        name: id
        required: true
        type: string
      - description: Remove Team Game Role From User Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_domain_team_games.RemoveTeamGameRoleFromUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
      security:
      - BearerAuth: []
      summary: Remove Team Game Role from Member
      tags:
      - Team Games
    post:
      consumes:
      - application/json
      description: Add a specific role to members in a team game
      parameters:
      - description: Team Game ID
        in: path
        name: id
        required: true
        type: string
      - description: Add Team Game Role To Member Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_domain_team_games.AddTeamGameRoleToMemberRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/arena_pkg_response.ResponseError'
      security:
      - BearerAuth: []
      summary: Add Team Game Role to Member
      tags:
      - Team Games
  /api/v1/teams:
    get:
      consumes:
      - application/json
      description: Retrieves a list of teams with optional filters
      parameters:
      - description: Filter by country ID
        in: query
        name: country_id
        type: integer
      - description: Filter by owner ID
        in: query
        name: owner_id
        type: integer
      - description: Filter by active status
        in: query
        name: active
        type: boolean
      - description: Filter by name substring
        in: query
        name: name_like
        type: string
      - description: Filter by tag substring
        in: query
        name: tag_like
        type: string
      - default: 10
        description: Limit number of results
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset for pagination
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get list of teams
      tags:
      - Teams
    post:
      consumes:
      - application/json
      description: Adds a member to a team
      parameters:
      - description: Team info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_domain_teams.RegisterTeamRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
