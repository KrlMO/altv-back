basePath: /
definitions:
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.UserResponse:
    properties:
      id:
        type: integer
      nickname:
        type: string
      profile_photo:
        type: string
      provider_uid:
        type: string
    type: object
  dto.CountryResponse:
    properties:
      flag_path:
        type: string
      id:
        type: integer
      iso_code:
        type: string
      name:
        type: string
    type: object
  response.ResponseError:
    properties:
      error:
        type: string
      ok:
        type: boolean
    type: object
  teamgames.AddTeamGameMembersRequest:
    properties:
      game_id:
        type: integer
      members:
        items:
          $ref: '#/definitions/teamgames.ReqTeamGameMember'
        maxItems: 50
        minItems: 1
        type: array
    required:
    - game_id
    - members
    type: object
  teamgames.AddTeamGameRoleToMemberRequest:
    properties:
      users:
        items:
          $ref: '#/definitions/teamgames.TeamGameMemberDto'
        maxItems: 50
        minItems: 1
        type: array
    required:
    - users
    type: object
  teamgames.RemoveTeamGameMembersRequest:
    properties:
      members:
        items:
          type: integer
        maxItems: 50
        minItems: 1
        type: array
    required:
    - members
    type: object
  teamgames.RemoveTeamGameRoleFromUserRequest:
    properties:
      users:
        items:
          $ref: '#/definitions/teamgames.TeamGameMemberDto'
        maxItems: 50
        minItems: 1
        type: array
    required:
    - users
    type: object
  teamgames.ReqTeamGameMember:
    properties:
      teamGameRoleID:
        type: integer
      userID:
        type: integer
    type: object
  teamgames.TeamGameMemberDto:
    properties:
      roles:
        items:
          $ref: '#/definitions/teamgames.TeamGameRoleDto'
        type: array
      userID:
        type: integer
    type: object
  teamgames.TeamGameRoleDto:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  teams.AddMemberRequest:
    properties:
      role:
        type: string
      user_id:
        type: integer
    required:
    - role
    - user_id
    type: object
  teams.CreateTeamGameRequest:
    properties:
      active:
        type: boolean
      banner_path:
        type: string
      game_slug:
        type: string
      logo_path:
        type: string
      name:
        maxLength: 150
        minLength: 3
        type: string
    required:
    - game_slug
    - name
    type: object
  teams.PatchUpdateTeamRequest:
    properties:
      banner_path:
        type: string
      country_id:
        type: integer
      description:
        type: string
      is_virtual:
        type: boolean
      logo_path:
        type: string
      name:
        type: string
      tag:
        type: string
    type: object
  teams.RegisterTeamRequest:
    properties:
      banner_path:
        type: string
      country_id:
        type: integer
      description:
        maxLength: 500
        type: string
      is_virtual:
        type: boolean
      logo_path:
        type: string
      name:
        maxLength: 50
        minLength: 3
        type: string
      tag:
        maxLength: 15
        minLength: 2
        type: string
    required:
    - country_id
    - name
    - tag
    type: object
  teams.UpdateTeamMemberRoleRequest:
    properties:
      role:
        type: string
    required:
    - role
    type: object
  users.FastRegisterUserRequest:
    properties:
      country_id:
        type: integer
      email:
        type: string
      nickname:
        type: string
      password:
        type: string
    required:
    - country_id
    - email
    - nickname
    - password
    type: object
  users.PatchUserProfileRequest:
    properties:
      banner_photo:
        type: string
      birth_date:
        type: string
      country_id:
        type: integer
      first_name:
        type: string
      last_name:
        type: string
      nickname:
        type: string
      profile_photo:
        type: string
    type: object
  users.RegisterUserRequest:
    properties:
      birth_date:
        type: string
      country_id:
        type: integer
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      nickname:
        type: string
      password:
        type: string
    required:
    - birth_date
    - country_id
    - email
    - first_name
    - last_name
    - nickname
    - password
    type: object
  users.UpdateUserProfileRequest:
    properties:
      banner_photo:
        type: string
      birth_date:
        type: string
      country_id:
        type: integer
      first_name:
        type: string
      last_name:
        type: string
      nickname:
        type: string
      profile_photo:
        type: string
    type: object
  users.UserProfileResponse:
    properties:
      banner_photo:
        type: string
      birth_date:
        type: string
      country:
        $ref: '#/definitions/dto.CountryResponse'
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      nickname:
        type: string
      profile_photo:
        type: string
    type: object
info:
  contact: {}
  description: API principal de Arena Latam
  title: Arena API
  version: "1.0"
paths:
  /api/v1/auth/login/local:
    post:
      consumes:
      - application/json
      description: Logs in a user
      parameters:
      - description: User info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login a user
      tags:
      - Auth
  /team-games/{id}/leave:
    post:
      consumes:
      - application/json
      description: Allows the current user to leave a team game
      parameters:
      - description: Team Game ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ResponseError'
      security:
      - BearerAuth: []
      summary: Leave Team Game
      tags:
      - Team Games
  /team-games/{id}/members:
    delete:
      consumes:
      - application/json
      description: Remove members from a team game
      parameters:
      - description: Team Game ID
        in: path
        name: id
        required: true
        type: string
      - description: Remove Team Game Members Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/teamgames.RemoveTeamGameMembersRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ResponseError'
      security:
      - BearerAuth: []
      summary: Remove Members from Team Game
      tags:
      - Team Games
    get:
      consumes:
      - application/json
      description: Get public members of a team game by team game ID
      parameters:
      - description: Team Game ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ResponseError'
      summary: List Team Game Members
      tags:
      - Team Games
    post:
      consumes:
      - application/json
      description: Add members to a team game
      parameters:
      - description: Team Game ID
        in: path
        name: id
        required: true
        type: string
      - description: Add Team Game Members Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/teamgames.AddTeamGameMembersRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ResponseError'
      security:
      - BearerAuth: []
      summary: Add Members to Team Game
      tags:
      - Team Games
  /team-games/{id}/members/roles:
    delete:
      consumes:
      - application/json
      description: Remove a specific role from members in a team game
      parameters:
      - description: Team Game ID
        in: path
        name: id
        required: true
        type: string
      - description: Remove Team Game Role From User Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/teamgames.RemoveTeamGameRoleFromUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ResponseError'
      security:
      - BearerAuth: []
      summary: Remove Team Game Role from Member
      tags:
      - Team Games
    post:
      consumes:
      - application/json
      description: Add a specific role to members in a team game
      parameters:
      - description: Team Game ID
        in: path
        name: id
        required: true
        type: string
      - description: Add Team Game Role To Member Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/teamgames.AddTeamGameRoleToMemberRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ResponseError'
      security:
      - BearerAuth: []
      summary: Add Team Game Role to Member
      tags:
      - Team Games
  /teams:
    get:
      consumes:
      - application/json
      description: Retrieves a list of teams with optional filters
      parameters:
      - description: Filter by country ID
        in: query
        name: country_id
        type: integer
      - description: Filter by owner ID
        in: query
        name: owner_id
        type: integer
      - description: Filter by active status
        in: query
        name: active
        type: boolean
      - description: Filter by name substring
        in: query
        name: name_like
        type: string
      - description: Filter by tag substring
        in: query
        name: tag_like
        type: string
      - default: 10
        description: Limit number of results
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset for pagination
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get list of teams
      tags:
      - Teams
    post:
      consumes:
      - application/json
      description: Adds a member to a team
      parameters:
      - description: Team info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/teams.RegisterTeamRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add a member to a team
      tags:
      - Teams
  /teams/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves a team by its ID
      parameters:
      - description: Team ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get team by ID
      tags:
      - Teams
    patch:
      consumes:
      - application/json
      description: Updates the details of an existing team
      parameters:
      - description: Team ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated team info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/teams.PatchUpdateTeamRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update team details
      tags:
      - Teams
  /teams/{id}/games:
    post:
      consumes:
      - application/json
      description: Add a game into a team
      parameters:
      - description: Team ID
        in: path
        name: id
        required: true
        type: string
      - description: Team Game info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/teams.CreateTeamGameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add a game into a team
      tags:
      - Teams
  /teams/{id}/members:
    post:
      consumes:
      - application/json
      description: Adds a member to a team
      parameters:
      - description: Team ID
        in: path
        name: id
        required: true
        type: string
      - description: Member info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/teams.AddMemberRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add a member to a team
      tags:
      - Teams
  /teams/{id}/members/{userId}:
    delete:
      consumes:
      - application/json
      description: Delete member from a team
      parameters:
      - description: Team ID
        in: path
        name: id
        required: true
        type: string
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete member from a team
      tags:
      - Teams
    patch:
      consumes:
      - application/json
      description: Updates team member role role
      parameters:
      - description: Team ID
        in: path
        name: id
        required: true
        type: string
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      - description: Role
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/teams.UpdateTeamMemberRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Updates team member role role
      tags:
      - Teams
  /users/fast-register:
    post:
      consumes:
      - application/json
      description: Quickly creates a new user in the system with minimal info
      parameters:
      - description: User info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.FastRegisterUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Fast register a new user
      tags:
      - Users
  /users/me:
    get:
      description: Retrieves the profile of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/users.UserProfileResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - Users
    patch:
      consumes:
      - application/json
      description: Partially updates the profile of the currently authenticated user
      parameters:
      - description: Partially updated user info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.PatchUserProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Partially update current user profile
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Updates the profile of the currently authenticated user
      parameters:
      - description: Updated user info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.UpdateUserProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - Users
  /users/register:
    post:
      consumes:
      - application/json
      description: Creates a new user in the system
      parameters:
      - description: User info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/users.RegisterUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - Users
schemes:
- http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
